name: Compilar Instalador Windows y Publicar Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Instalador Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow reportlab matplotlib pandas openpyxl httpx pydantic pydantic_settings python-barcode babel python-escpos pyusb pywin32 fastapi uvicorn "sqlalchemy[asyncio]" greenlet aiosqlite asyncpg "python-jose[cryptography]" "passlib[bcrypt]" "bcrypt==3.2.2" python-multipart

      - name: Instalar Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compilar VmPOS.exe e Instalador Setup
        shell: bash
        run: |
          set -eo pipefail
          python packaging/build_windows.py 2>&1 | tee build.log

      - name: Diagnostico en caso de error
        if: failure()
        shell: bash
        run: |
          cp build.log build_log.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f build_log.txt
          git commit -m "chore(debug): build log"
          git push origin main

      - name: Subir log de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build.log

      - name: Comprimir versión portable Windows
        shell: pwsh
        run: |
          if (Test-Path "dist/VmPOS") {
            Compress-Archive -Path "dist/VmPOS\*" -DestinationPath "dist/VmPOS_Windows_Portable.zip" -Force
          }

      - name: Subir artefactos de Windows a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VmPOS-Windows-Instalador
          path: |
            dist/*.exe
            dist/*.zip

      - name: Publicar Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v4.1.0
          name: "VmPOS v4.1.0 — Sincronización Total Multicaja, Fiados Atómicos y Anti-Duplicados"
          body: |
            ## 🚀 VmPOS v4.1.0 — Instaladores Oficiales Centralizados

            ### 📦 Descargas Disponibles:
            - **Windows (Instalador Setup .exe)**: `VmPOS_Setup_v4.1.0.exe` (Instalación limpia, motor FastAPI centralizado, puerto único 8000 y reglas de firewall)
            - **Windows (Portable .zip)**: `VmPOS_Windows_Portable.zip` (Descomprimir y usar de inmediato)
            - **macOS (Instalador DMG)**: `VmPOS_macOS_Instalador.dmg` (Arrastrar a Aplicaciones)

            ---
            ### ✨ Novedades Principales v4.1.0:
            - **Sincronización Total Multicaja en Tiempo Real**: Computadoras Windows y Mac comparten la misma base de datos central sin dependencias de SQLite local para catálogo ni ventas.
            - **Integridad Atómica de Fiados y Cartera**: Asociación automática e inmediata de ventas fiadas con saldo_pendiente del cliente y movimientos de cartera.
            - **Abonos FIFO Con Trazabilidad Contable**: Los abonos descuentan la deuda en estricto orden cronológico, registran el medio de pago real (Efectivo en gaveta vs Transferencia en banco) y no inflan ventas.
            - **Prevención de Ventas Duplicadas**: Bloqueo asíncrono con `idempotency_key`, protección contra 40+ clics repetidos, concurrencia simultánea y recuperación ante microcortes de red.
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
        continue-on-error: true
