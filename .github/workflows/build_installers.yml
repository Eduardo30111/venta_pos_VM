name: Compilar Instaladores y Publicar Release Oficial

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  test-and-verify:
    name: Pruebas Automatizadas y Verificación de Integridad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de pruebas
        run: |
          python -m pip install --upgrade pip
          pip install httpx pydantic pydantic_settings fastapi uvicorn "sqlalchemy[asyncio]" greenlet aiosqlite asyncpg "python-jose[cryptography]" bcrypt python-multipart reportlab pillow

      - name: Ejecutar pruebas unitarias de backend e integridad
        run: |
          python -m unittest tests/test_idempotencia_global.py tests/test_seguridad_rehash.py tests/test_proveedor_phantom_balance.py tests/test_compra_ajuste_stock.py tests/test_auditoria_idempotencia_exhaustiva.py tests/test_seguridad_usuarios_db.py tests/test_seguridad_activacion_admin.py tests/test_migraciones_excepciones.py

  build-macos:
    name: Compilar Instalador macOS (.dmg y .zip)
    needs: test-and-verify
    runs-on: macos-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow reportlab matplotlib pandas openpyxl httpx pydantic pydantic_settings python-barcode babel python-escpos pyusb fastapi uvicorn "sqlalchemy[asyncio]" greenlet aiosqlite asyncpg "python-jose[cryptography]" "passlib[bcrypt]" "bcrypt==3.2.2" python-multipart

      - name: Compilar VmPOS.app y DMG
        run: |
          export PYTHON="$(which python3)"
          bash packaging/build_macos.sh

      - name: Subir artefactos de macOS a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VmPOS-macOS-Instalador
          path: |
            dist/*.dmg
            dist/*.zip

  build-windows:
    name: Compilar Instalador Windows (.exe)
    needs: test-and-verify
    runs-on: windows-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow reportlab matplotlib pandas openpyxl httpx pydantic pydantic_settings python-barcode babel python-escpos pyusb pywin32 fastapi uvicorn "sqlalchemy[asyncio]" greenlet aiosqlite asyncpg "python-jose[cryptography]" "passlib[bcrypt]" "bcrypt==3.2.2" python-multipart

      - name: Instalar Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compilar VmPOS.exe e Instalador Setup
        shell: bash
        run: |
          set -eo pipefail
          python packaging/build_windows.py 2>&1 | tee build.log

      - name: Subir log de compilacion Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build.log

      - name: Comprimir versión portable Windows
        shell: pwsh
        run: |
          if (Test-Path "dist/VmPOS") {
            Compress-Archive -Path "dist/VmPOS\*" -DestinationPath "dist/VmPOS_Windows_Portable.zip" -Force
          }

      - name: Subir artefactos de Windows a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VmPOS-Windows-Instalador
          path: |
            dist/*.exe
            dist/*.zip

  publish-release:
    name: Publicar Release Oficial en GitHub
    needs: [test-and-verify, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos macOS
        uses: actions/download-artifact@v4
        with:
          name: VmPOS-macOS-Instalador
          path: dist

      - name: Descargar artefactos Windows
        uses: actions/download-artifact@v4
        with:
          name: VmPOS-Windows-Instalador
          path: dist

      - name: Publicar Release Oficial
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "VmPOS ${{ github.ref_name }} — Sincronización Total, Seguridad y Activación Oficial"
          body: |
            ## 🚀 VmPOS ${{ github.ref_name }} — Instaladores Oficiales Centralizados

            ### 📦 Descargas Disponibles:
            - **Windows (Instalador Setup .exe)**: `VmPOS_Setup_${{ github.ref_name }}.exe` (Instalación limpia, motor FastAPI centralizado, puerto único 8000 y reglas de firewall)
            - **Windows (Portable .zip)**: `VmPOS_Windows_Portable.zip` (Descomprimir y usar de inmediato)
            - **macOS (Instalador DMG)**: `VmPOS_macOS_Instalador.dmg` (Arrastrar a Aplicaciones)
            - **macOS (Paquete .zip)**: `VmPOS_macOS.zip` (Distribución nativa macOS)

            ---
            ### ✨ Novedades Principales ${{ github.ref_name }}:
            - **Activación Inicial Segura**: Asistente de primer arranque para definir credenciales de administrador personalizadas con validación de fortaleza.
            - **Eliminación de Contraseña Predeterminada**: Bloqueo estricto y solicitud obligatoria de cambio de contraseña ante claves temporales (`admin123`).
            - **Sincronización Total Multicaja en Tiempo Real**: Computadoras Windows y macOS comparten la misma base central sin dependencias de SQLite local para catálogo ni ventas.
            - **Integridad Atómica de Fiados y Cartera**: Asociación automática e inmediata de ventas fiadas con saldo_pendiente del cliente y movimientos de cartera.
            - **Abonos FIFO Con Trazabilidad Contable**: Descuento cronológico de deuda y medios de pago reales (Efectivo vs Banco).
            - **Prevención de Ventas Duplicadas**: Bloqueo asíncrono con `idempotency_key`, protección contra clics repetidos, concurrencia simultánea y recuperación ante microcortes de red.
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
