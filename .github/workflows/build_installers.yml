name: Compilar y Publicar Instaladores (Windows y macOS)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Instalador Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow reportlab matplotlib pandas openpyxl httpx pydantic pydantic_settings python-barcode babel python-escpos pyusb pywin32

      - name: Compilar aplicación con PyInstaller
        run: |
          python packaging/build_windows.py

      - name: Compilar instalador con Inno Setup
        uses: Min-Feng/action-innosetup@v1
        with:
          iss-path: 'packaging/installer_windows.iss'
        continue-on-error: true

      - name: Comprimir versión portable Windows
        shell: pwsh
        run: |
          if (Test-Path "dist/VmPOS") {
            Compress-Archive -Path "dist/VmPOS" -DestinationPath "dist/VmPOS_Windows_Portable.zip" -Force
          }

      - name: Subir artefactos Windows
        uses: actions/upload-artifact@v4
        with:
          name: VmPOS-Windows
          path: |
            dist/*.exe
            dist/*.zip

  build-macos:
    name: Compilar Instalador macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller pillow reportlab matplotlib pandas openpyxl httpx pydantic pydantic_settings python-barcode babel python-escpos pyusb

      - name: Compilar instalador DMG y ZIP para macOS
        run: |
          bash packaging/build_macos.sh

      - name: Subir artefactos macOS
        uses: actions/upload-artifact@v4
        with:
          name: VmPOS-macOS
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    name: Publicar Release Oficial en GitHub
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - name: Descargar artefactos Windows
        uses: actions/download-artifact@v4
        with:
          name: VmPOS-Windows
          path: release_assets/
        continue-on-error: true

      - name: Descargar artefactos macOS
        uses: actions/download-artifact@v4
        with:
          name: VmPOS-macOS
          path: release_assets/
        continue-on-error: true

      - name: Crear o actualizar Release en GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v4.0.0-latest
          name: "VmPOS v4.0.0 — Instaladores Oficiales (Windows y macOS)"
          body: |
            ## 🚀 VmPOS v4.0.0 — Versión Oficial

            ### 📦 Descargas Disponibles:
            - **macOS (Instalador DMG)**: `VmPOS_macOS_Instalador.dmg` (Arrastrar a Aplicaciones)
            - **macOS (Portable ZIP)**: `VmPOS_macOS.zip`
            - **Windows (Instalador Setup)**: `VmPOS_Setup_v4.0.exe` (Asistente de Instalación con Firewall)
            - **Windows (Portable ZIP)**: `VmPOS_Windows_Portable.zip` (Descomprimir y ejecutar `VmPOS.exe`)

            ---
            ### ✨ Novedades y Correcciones:
            - Módulo de Fiados, Abonos y Cartera 100% auditado y corregido.
            - Eliminación definitiva limpia de clientes y cuentas de prueba.
            - Soporte de arquitectura cliente-servidor multi-caja.
            - Compatible con macOS (Apple Silicon / Intel) y Windows 10 / 11.
          draft: false
          prerelease: false
          files: release_assets/*
        continue-on-error: true
