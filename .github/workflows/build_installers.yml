name: Compilar Instaladores (Windows y macOS)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    name: Compilar Instalador Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow reportlab matplotlib pandas openpyxl httpx pydantic pydantic_settings python-barcode babel python-escpos pyusb pywin32

      - name: Compilar aplicacion portable con PyInstaller
        run: |
          python packaging/build_windows.py

      - name: Compilar instalador con Inno Setup
        uses: Min-Feng/action-innosetup@v1
        with:
          iss-path: 'packaging/installer_windows.iss'
        continue-on-error: true

      - name: Subir Instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: VmPOS-Windows-Instalador
          path: |
            dist/VmPOS_Setup_v4.0.exe
            dist/VmPOS/
