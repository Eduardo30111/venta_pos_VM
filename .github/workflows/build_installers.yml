name: Compilar Instaladores (Windows y macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: 🍎 Compilar Instalador macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller httpx reportlab matplotlib pandas openpyxl pillow pydantic pydantic-settings python-escpos python-barcode

      - name: Ejecutar empaquetado macOS
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Subir Instalador DMG como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VmPOS-macOS-Instalador
          path: dist/VmPOS_macOS_Instalador.dmg

  build-windows:
    name: 🪟 Compilar Instalador Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller httpx reportlab matplotlib pandas openpyxl pillow pydantic pydantic-settings python-escpos pywin32 python-barcode

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name="VmPOS" `
            --icon="assets/Salome.ico" `
            --add-data="assets;assets" `
            --add-data="config;config" `
            --add-data="database;database" `
            --add-data="interface;interface" `
            --add-data="client;client" `
            --add-data="network_config.json;." `
            --hidden-import="reportlab" `
            --hidden-import="reportlab.lib" `
            --hidden-import="reportlab.platypus" `
            --hidden-import="reportlab.pdfgen" `
            --hidden-import="matplotlib" `
            --hidden-import="matplotlib.backends.backend_tkagg" `
            --hidden-import="pandas" `
            --hidden-import="openpyxl" `
            --hidden-import="PIL" `
            --hidden-import="PIL.Image" `
            --hidden-import="PIL.ImageTk" `
            --hidden-import="sqlite3" `
            --hidden-import="escpos" `
            --hidden-import="win32print" `
            --hidden-import="httpx" `
            --hidden-import="pydantic" `
            --hidden-import="pydantic_settings" `
            --hidden-import="barcode" `
            --hidden-import="barcode.codex" `
            --hidden-import="barcode.ean" `
            --hidden-import="barcode.writer" `
            interface/inicio_sesion.py

      - name: Instalar Inno Setup y Compilar Instalador .exe
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: packaging/installer_windows.iss

      - name: Subir Instalador Windows como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VmPOS-Windows-Setup
          path: dist/VmPOS_Setup_v4.0.exe
